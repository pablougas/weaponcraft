<!doctype html>
<html lang="en" class="wc-fullscreen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c1226" />
    <meta
      name="description"
      content="Weaponcraft: a fallen god forges and fuses weapons in a world occupied by humans and their mechs."
    />
    <!-- Empty icon so the browser doesn't request /favicon.ico (no off-origin or failing requests). -->
    <link rel="icon" href="data:," />
    <title>Weaponcraft</title>
    <style>
      /* Inline so the loading screen paints before any JavaScript arrives. */
      html.wc-fullscreen,
      html.wc-fullscreen body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c1226;
        color: #eef1f7;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #wc-loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(ellipse at 50% 60%, #26365e 0%, #0c1226 70%);
        transition: opacity 0.6s ease;
      }
      #wc-loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #wc-loading h1 {
        margin: 0 0 10px;
        color: #f2c45a;
        font-family: Cinzel, "Trajan Pro", "Palatino Linotype", Palatino, Georgia, serif;
        font-size: clamp(22px, 4vw, 40px);
        font-weight: 700;
        letter-spacing: 0.32em;
      }
      #wc-loading p {
        margin: 0;
        color: #a9b3c7;
        font-size: 13px;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <div id="wc-loading" role="status" aria-live="polite">
      <div>
        <h1>WEAPONCRAFT</h1>
        <p id="wc-loading-text">Forging the world…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
